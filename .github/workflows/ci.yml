# Molior CI
#
# Setup:    CI Image (manual), Configure (versions, target)
# Tests:    Lint, Unit Tests, System Tests and Deploy Tests in parallel, Combine Coverage
# Build:    Docker Images, Helm Chart (after the tests, all with the CI version), pushed to ghcr.io/<owner>/<target>/
#           <image>:<version> and ghcr.io/<owner>/<target>/charts/molior:<version>; target dev, test or prod by branch.
#           The images of test and prod also get the tag latest (the chart not: helm needs semver tags).
#           Old dev and test versions are deleted by .github/workflows/retention-cleanup.yml (daily).
#           Dependabot branches (dependabot/...) are built and tested, but not pushed.
#
# The CI image is molior-base (docker/molior/molior-base.Dockerfile: the build dependencies of the deb packages) plus
# the python packages the unit tests import (docker/ci.Dockerfile). The test and image jobs use it as molior-base:dev.
# The "CI Image" job runs only with "Run workflow" (workflow_dispatch). It builds the image and pushes it to the GitHub
# container registry of this repository as ghcr.io/<owner>/<repo>/molior-ci:latest, which the other jobs use. Run it
# again when debian/control, molior-base.Dockerfile or ci.Dockerfile change.
#
# Summaries: every job writes a step summary (.github/scripts/summary.py). Warnings (flake8 findings, pytest warnings,
# tracebacks, errors and warnings in the server logs, docker build warnings) are shown in the summary and as
# annotations; they do not fail the job.
#
# Runner: needs docker (the system tests create a k3d cluster, the image jobs run docker build) and sudo for the
# packages that are missing (.github/scripts/install-tools.sh). Set the repository variable CI_RUNNER to use another
# runner than ubuntu-latest. The deploy tests run molior-deploy on the runner itself (root, loop devices, nbd,
# virtualbox; .github/scripts/install-molior-tools.sh).

name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# No concurrency group: every push gets a complete run, a new run never cancels or replaces an older one

env:
  # make uses podman when it is installed (ubuntu-latest has it); CI logs in, pulls and builds with docker
  DOCKERCMD: docker
  # tools of the system tests and the image job (.github/scripts/install-tools.sh)
  K3D_VERSION: v5.9.0
  HELM_VERSION: v4.2.3
  KUBECTL_VERSION: v1.35.7
  # molior-tools of the deploy tests: a tag (or commit) of https://github.com/molior-dbs/molior-tools, built on the runner
  MOLIOR_TOOLS_VERSION: v1.5.0-alpha9

jobs:
  ##############################################################################
  # Setup
  ##############################################################################

  build-ci-image:
    name: CI Image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      CI_IMAGE: ghcr.io/${{ github.repository }}/molior-ci:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          docker build --pull -t molior-base:dev -f docker/molior/molior-base.Dockerfile . 2>&1 | tee build-base.log
          docker build -t "$CI_IMAGE" -f docker/ci.Dockerfile . 2>&1 | tee build-ci.log

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker push "$CI_IMAGE"

      - name: Summary
        if: always()
        run: |
          python3 .github/scripts/summary.py images "CI image" "$CI_IMAGE"
          python3 .github/scripts/summary.py docker-build "CI image build" build-base.log build-ci.log

      - name: Cleanup
        if: always()
        run: docker rmi -f "$CI_IMAGE" molior-base:dev || true

  configure:
    name: Configure
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      molior-version: ${{ steps.version.outputs.molior-version }}
      target: ${{ steps.version.outputs.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # One version for the deb packages (debian/changelog, set with make set-version), the docker images and the
      # helm chart: <changelog version, ~ as ->-<UTC date and time>-<commit>, e.g. 1.5.0-beta46-20260101120000-0123abcd
      - name: Compute version and target
        id: version
        run: |
          base=$(sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p' debian/changelog)
          test -n "$base" || { echo "E: no version in the first line of debian/changelog"; exit 1; }
          MOLIOR_VERSION=$(echo "$base" | tr '~' '-')-$(date -u +%Y%m%d%H%M%S)-$(echo "$GITHUB_SHA" | cut -c1-8)
          dpkg --validate-version "$MOLIOR_VERSION"
          case "$GITHUB_REF_NAME" in
            master) TARGET=prod ;;
            dev) TARGET=test ;;
            *) TARGET=dev ;;
          esac
          {
            echo "molior-version=$MOLIOR_VERSION"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Configure"
            echo ""
            echo "* Version: \`$MOLIOR_VERSION\` (debian/changelog \`$base\`)"
            echo "* Target: \`$TARGET\` (branch \`$GITHUB_REF_NAME\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # Tests
  ##############################################################################

  # lint and unit-tests: make runs them in the CI image (TEST_IMAGE), as on a dev machine; no local flake8 or pytest
  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      TEST_IMAGE: ghcr.io/${{ github.repository }}/molior-ci:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install docker
        run: sh .github/scripts/install-tools.sh "$HOME/.local/bin" docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the CI image
        run: docker pull "$TEST_IMAGE"

      - name: flake8
        shell: bash
        run: |
          set -o pipefail
          make lint 2>&1 | tee flake8.txt

      - name: Summary
        if: always()
        run: python3 .github/scripts/summary.py flake8 flake8.txt

  tests-unit:
    name: Unit Tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      TEST_IMAGE: ghcr.io/${{ github.repository }}/molior-ci:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install docker
        run: sh .github/scripts/install-tools.sh "$HOME/.local/bin" docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the CI image
        run: docker pull "$TEST_IMAGE"

      - name: Run unit tests
        env:
          COVERAGE_FILE: coverage-unit.data
        shell: bash
        run: |
          set -o pipefail
          make unit-tests 2>&1 | tee unit-tests.txt

      - name: Summary
        if: always()
        run: python3 .github/scripts/summary.py junit "Unit tests" unit-test-report.xml unit-tests.txt

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-unit
          path: |
            coverage-unit.data
            unit-test-report.xml
            unit-tests.txt
          if-no-files-found: error

  # One cluster, one pytest run: the suites run after each other (smoke first)
  tests-system:
    name: System Tests
    needs: configure
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    env:
      MOLIOR_VERSION: ${{ needs.configure.outputs.molior-version }}
      RESULTS_DIR: ${{ github.workspace }}/system-test-results
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true   # tests/system/ctzpos-cups.tar.xz, the repository of test_mirror

      - name: Install docker, qemu, k3d, helm, kubectl
        run: |
          sh .github/scripts/install-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CI image as molior-base:dev  # the base of the test images
        env:
          CI_IMAGE: ghcr.io/${{ github.repository }}/molior-ci:latest
        run: |
          docker pull "$CI_IMAGE"
          docker tag "$CI_IMAGE" molior-base:dev

      - name: Set version
        run: make set-version

      - name: Run system tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RESULTS_DIR"
          make system-tests 2>&1 | tee "$RESULTS_DIR/system-tests.txt"

      - name: Summary
        if: always()
        run: |
          python3 .github/scripts/summary.py junit "System tests" "$RESULTS_DIR/junit.xml" "$RESULTS_DIR/system-tests.txt"
          python3 .github/scripts/summary.py logs "Server logs (system tests)" "$RESULTS_DIR"/*.log

      - name: Upload system test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-system
          path: |
            system-test-results/
            !system-test-results/buildout/
          if-no-files-found: error

  # molior-deploy (molior-tools) on the runner against molior in a k3d cluster of its own (tests/deploy/deploy-tests.sh)
  tests-deploy:
    name: Deploy Tests
    needs: configure
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    env:
      MOLIOR_VERSION: ${{ needs.configure.outputs.molior-version }}
      RESULTS_DIR: ${{ github.workspace }}/deploy-test-results
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install docker, qemu, k3d, helm, kubectl
        run: |
          sh .github/scripts/install-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install molior-tools, virtualbox and the deploy tools
        run: sh .github/scripts/install-molior-tools.sh "$MOLIOR_TOOLS_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CI image as molior-base:dev  # the base of the test images
        env:
          CI_IMAGE: ghcr.io/${{ github.repository }}/molior-ci:latest
        run: |
          docker pull "$CI_IMAGE"
          docker tag "$CI_IMAGE" molior-base:dev

      - name: Set version
        run: make set-version

      - name: Run deploy tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RESULTS_DIR"
          make deploy-tests 2>&1 | tee "$RESULTS_DIR/deploy-tests.txt"

      - name: Summary
        if: always()
        run: |
          python3 .github/scripts/summary.py junit "Deploy tests" "$RESULTS_DIR/junit.xml" "$RESULTS_DIR/deploy-tests.txt"
          python3 .github/scripts/summary.py logs "Server logs (deploy tests)" "$RESULTS_DIR"/*.log

      # from molior-deploy-output/ only the log of each molior-deploy call (<project>_<version>_<variant>_<date>.log,
      # molior-deploy -L) and of each VM (<deployment>.VBox.log) and the screenshots (<deployment>.png), not the
      # deployments themselves (tar.gz, iso, ova, img.gz: several GB)
      - name: Upload deploy test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-deploy
          path: |
            deploy-test-results/
            !deploy-test-results/buildout/
            !deploy-test-results/molior-deploy-output/
            deploy-test-results/molior-deploy-output/*.log
            deploy-test-results/molior-deploy-output/*.png
          if-no-files-found: error

  coverage:
    name: Combine Coverage
    needs: [tests-unit, tests-system, tests-deploy]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/${{ github.repository }}/molior-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-*
          path: artifacts

      # .coveragerc maps the installed package of the system tests to the source tree
      - name: Combine coverage
        run: |
          files="artifacts/tests-unit/coverage-unit.data artifacts/tests-system/coverage.data artifacts/tests-deploy/coverage.data"
          for f in $files; do test -f "$f" || { echo "E: $f missing"; exit 1; }; done
          python3 -m coverage combine --keep --rcfile=.coveragerc $files
          python3 -m coverage report --rcfile=.coveragerc | tee coverage.txt
          python3 -m coverage xml --rcfile=.coveragerc -o coverage.xml
          {
            echo "### Coverage"
            echo ""
            for f in $files; do echo "* $f: $(python3 -m coverage report --rcfile=.coveragerc --data-file="$f" | grep '^TOTAL')"; done
            echo "* combined: $(grep '^TOTAL' coverage.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.txt
          if-no-files-found: error

  ##############################################################################
  # Build (no push yet)
  ##############################################################################

  images:
    name: Docker Images
    needs: [configure, lint, tests-unit, tests-system, tests-deploy]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      MOLIOR_VERSION: ${{ needs.configure.outputs.molior-version }}
      TARGET: ${{ needs.configure.outputs.target }}
      # e.g. ghcr.io/molior-dbs/dev/molior:<version>
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ needs.configure.outputs.target }}
      PUSHED: ${{ !startsWith(github.ref_name, 'dependabot/') && 'pushed to' || 'not pushed (dependabot), would be' }}
      LATEST: ${{ needs.configure.outputs.target != 'dev' && ' and :latest' || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install docker, qemu, k3d, helm, kubectl
        run: |
          sh .github/scripts/install-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CI image as molior-base:dev  # the base of the molior image
        env:
          CI_IMAGE: ghcr.io/${{ github.repository }}/molior-ci:latest
        run: |
          docker pull "$CI_IMAGE"
          docker tag "$CI_IMAGE" molior-base:dev

      - name: Set version
        run: make set-version

      - name: Build images
        shell: bash
        run: |
          set -o pipefail
          make docker-images IMAGE_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 2>&1 \
            | tee build-images.log

      - name: Tag images
        run: make tag-images

      - name: Push images
        if: ${{ !startsWith(github.ref_name, 'dependabot/') }}
        run: make push REGISTRY="$IMAGE_PREFIX"

      # the same images as <image>:latest (only the tag is new, the layers are already pushed)
      - name: Push latest tag
        if: ${{ !startsWith(github.ref_name, 'dependabot/') && env.TARGET != 'dev' }}
        run: make push REGISTRY="$IMAGE_PREFIX" MOLIOR_VERSION=latest

      - name: Summary
        if: always()
        run: |
          python3 .github/scripts/summary.py images \
            "Docker images ($PUSHED $IMAGE_PREFIX/<image>:$MOLIOR_VERSION$LATEST)" \
            molior:$MOLIOR_VERSION molior-postgres:$MOLIOR_VERSION aptly:$MOLIOR_VERSION molior-nginx:$MOLIOR_VERSION
          python3 .github/scripts/summary.py docker-build "Docker image build" build-images.log

  helm:
    name: Helm Chart
    needs: [configure, lint, tests-unit, tests-system, tests-deploy]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      MOLIOR_VERSION: ${{ needs.configure.outputs.molior-version }}
      TARGET: ${{ needs.configure.outputs.target }}
      # e.g. ghcr.io/molior-dbs/dev/charts/molior:<version>
      CHART_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ needs.configure.outputs.target }}/charts
      PUSHED: ${{ !startsWith(github.ref_name, 'dependabot/') && 'pushed to' || 'not pushed (dependabot), would be' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install helm
        run: |
          sh .github/scripts/install-tools.sh "$HOME/.local/bin" helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build helm chart
        shell: bash
        run: |
          set -o pipefail
          make chart 2>&1 | tee helm.txt

      - name: Push helm chart
        if: ${{ !startsWith(github.ref_name, 'dependabot/') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "molior-$MOLIOR_VERSION.tgz" "oci://$CHART_PREFIX" 2>&1 | tee -a helm.txt

      - name: Summary
        if: always()
        run: python3 .github/scripts/summary.py text "Helm chart ($PUSHED $CHART_PREFIX/molior:$MOLIOR_VERSION)" helm.txt

      - name: Upload helm chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: molior-${{ env.MOLIOR_VERSION }}.tgz
          if-no-files-found: error
