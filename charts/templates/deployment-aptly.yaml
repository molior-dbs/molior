---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aptly
  name: aptly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aptly
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: aptly
    spec:
{{- with .Values.aptly.fsGroup }}
      securityContext:
        fsGroup: {{ . | int64 }}
{{- end }}
      containers:
        - name: aptly-server
          image: {{ .Values.registry.host }}{{ with .Values.registry.port }}:{{ . }}{{ end }}/aptly:{{ .Values.molior.version }}
          imagePullPolicy: Always
          env:
            - name: REPOSIGN_EMAIL
              valueFrom:
                configMapKeyRef:
                  key: REPOSIGN_EMAIL
                  name: env
            - name: REPOSIGN_NAME
              valueFrom:
                configMapKeyRef:
                  key: REPOSIGN_NAME
                  name: env
          ports:
            - containerPort: 3143
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/aptly
              name: aptly
            - mountPath: /etc/aptly.conf
              name: aptly-conf
              subPath: aptly.conf

        - name: aptly-nginx
          image: {{ .Values.registry.host }}{{ with .Values.registry.port }}:{{ . }}{{ end }}/molior-nginx:{{ .Values.molior.version }}
          imagePullPolicy: Always
          env:
            - name: APTLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: aptly-password
                  name: molior-passwords
            - name: APTLY_USER
              valueFrom:
                configMapKeyRef:
                  key: APTLY_USER
                  name: env
            - name: APTLY_URL
              value: http://localhost:3142
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/aptly
              name: aptly
      restartPolicy: Always
      volumes:
        - name: aptly
          persistentVolumeClaim:
            claimName: aptly
        - name: aptly-conf
          configMap:
            name: aptly-cm
