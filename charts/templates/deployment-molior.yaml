apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: molior
  name: molior
spec:
  replicas: 1
  selector:
    matchLabels:
      app: molior
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: molior

    spec:
      serviceAccountName: molior-serviceaccount

      initContainers:

        - name: init-postgres
          image: {{ .Values.registry.host }}:{{ .Values.registry.port }}/molior-postgres:{{ .Values.molior.version }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "test -e /data/PG_VERSION || ( echo Initializing PostgreSQL database; cp -ar /var/lib/postgresql/17/main/* /data/; chown postgres:postgres /data; chmod 700 /data)"]
          volumeMounts:
            - mountPath: /data
              name: postgres

        - name: init-molior
          image: {{ .Values.registry.host }}:{{ .Values.registry.port }}/molior:{{ .Values.molior.version }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "test -e /data/buildout || ( echo Initializing Molior; cp -ar /var/lib/molior/* /data/; chown molior /data; chmod 755 /data )"]
          volumeMounts:
            - mountPath: /data
              name: molior

      containers:

        - name: molior-server
          image: {{ .Values.registry.host }}:{{ .Values.registry.port }}/molior:{{ .Values.molior.version }}
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c",
                  "echo 'preStop: signaling molior to shut down';

                  kill -TERM $(cat /var/run/molior.pid);

                  echo 'preStop: waiting for molior to finish';

                  while [ -f /var/run/molior.pid ]; do sleep 1; done;

                  echo 'preStop: molior done'"]
          securityContext:
            capabilities:
              add:
                - "SYS_ADMIN"
                - "MKNOD"
                - "SYS_CHROOT"
                - "SETFCAP"
          env:
            {{- if .Values.molior.dev }}
            - name: MOLIOR_DEV
              value: "1"
            {{- end }}
            - name: MOLIOR_BASE_PATH
              value: {{ .Values.molior.basePath | quote }}
            - name: APTLY_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: APTLY_PASSWORD
                  name: env
            - name: APTLY_USER
              valueFrom:
                configMapKeyRef:
                  key: APTLY_USER
                  name: env
            - name: DEBSIGN_EMAIL
              valueFrom:
                configMapKeyRef:
                  key: DEBSIGN_EMAIL
                  name: env
            - name: DEBSIGN_NAME
              valueFrom:
                configMapKeyRef:
                  key: DEBSIGN_NAME
                  name: env
            - name: REPOSIGN_EMAIL
              valueFrom:
                configMapKeyRef:
                  key: REPOSIGN_EMAIL
                  name: env
            - name: REPOSIGN_NAME
              valueFrom:
                configMapKeyRef:
                  key: REPOSIGN_NAME
                  name: env
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /var/run/postgresql
              name: pgsock
            - mountPath: /var/lib/molior
              name: molior
            - mountPath: /config
              name: molior-cm3
            - mountPath: /shutdown
              name: shutdown-sync

        - name: molior-postgres
          image: {{ .Values.registry.host }}:{{ .Values.registry.port }}/molior-postgres:{{ .Values.molior.version }}
          imagePullPolicy: Never
          lifecycle:
            preStop:
              exec:
                # wait for molior to finish, then stop postgres directly
                command: ["/bin/sh", "-c",
                  "echo 'preStop: waiting for molior to shut down...';
                  until [ -f /shutdown/molior-done ]; do echo 'preStop: molior not done yet...'; sleep 1; done;
                  echo 'preStop: molior done, stopping postgres...';
                  su postgres -c '/usr/lib/postgresql/17/bin/pg_ctl stop -D /var/lib/postgresql/17/main -m smart -w';
                  echo 'preStop: postgres stopped'"]
          ports:
            - containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["su", "postgres", "-c", "pg_isready -h /var/run/postgresql"]
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - mountPath: /var/run/postgresql
              name: pgsock
            - mountPath: /var/lib/postgresql/17/main
              name: postgres
            - mountPath: /shutdown
              name: shutdown-sync
      terminationGracePeriodSeconds: {{ .Values.molior.terminationGracePeriodSeconds }}
      restartPolicy: Always
      volumes:
        - name: molior
          persistentVolumeClaim:
            claimName: molior
        - name: pgsock
          persistentVolumeClaim:
            claimName: pgsock
        - name: postgres
          persistentVolumeClaim:
            claimName: postgres
        - configMap:
            name: molior-cm3
          name: molior-cm3
        - name: shutdown-sync
          emptyDir: {}

