---
# Nodes are cluster wide: molior lists the nodes with the node label of a build queue (builder.<arch>.nodeLabel),
# so a build fails at once if no node has the label instead of waiting for a node forever.
# Without this role molior skips the check.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: molior-node-reader-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: molior-node-reader-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: molior-serviceaccount
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: molior-node-reader-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
