apiVersion: v1
kind: ConfigMap
metadata:
  name: molior-cm3
  labels:
    app: molior
data:
  backend-kubernetes.yml: |
    registry:
        server: "{{ .Values.registry.host }}:{{ .Values.registry.port }}"
        user: "{{ .Values.registry.user }}"
        password: "{{ .Values.registry.password }}"

    builder:
        amd64:
            parallel: {{ .Values.builder.amd64.parallel }}

  molior.yml: |
    # Molior configuration

    server:
        url: '{{ .Values.molior.serverUrl }}'

    hostname: '{{ .Values.molior.hostname }}'
    working_dir: '/var/lib/molior'
    database: '/molior'

    debsign_gpg_email: '{{ .Values.molior.debsignEmail }}'

    builds:
        version_prefix: "{{ .Values.molior.versionPrefix }}"

    ci_builds:
        enabled: {{ .Values.molior.ciBuildsEnabled }}
        packages_ttl: {{ .Values.molior.ciPackagesTtl }}

    admin:
        admin_password: '{{ .Values.molior.adminPassword }}'

    auth_backend: 'db'

    backend: '{{ .Values.molior.backend }}'

    max_parallel_chroots: {{ .Values.molior.maxParallelChroots }}

    aptly:
        apt_url_public: '{{ .Values.aptly.publicUrl }}'
        apt_url: '{{ .Values.aptly.internalUrl }}'
        api_url: '{{ .Values.aptly.apiUrl }}'
        api_user: '{{ .Values.aptly.user }}'
        api_pass: '{{ .Values.aptly.password }}'
        gpg_key: '{{ .Values.aptly.gpgKey }}'
        key: 'archive-keyring.asc'
