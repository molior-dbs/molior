registry:
  host: k3d-molior-registry
  port: 5000
  user: ""
  password: ""

molior:
  version: dev
  # Set to true on dev clusters: allows plain-HTTP session cookies and
  # treats a missing admin_password as a warning rather than a hard error.
  dev: false
  # Base path when molior is served
  # Must end with a slash. Leave as "/" for root deployments.
  basePath: "/"
  serverUrl: "http://molior:9999"
  hostname: "127.0.0.1"
  debsignEmail: "debsign@molior"
  versionPrefix: "v"
  ciBuildsEnabled: true
  ciPackagesTtl: 7
  adminPassword: "molior-dev"
  backend: "kubernetes"
  maxParallelChroots: 2
  terminationGracePeriodSeconds: 300

aptly:
  publicUrl: "http://localhost:8080"
  internalUrl: "http://aptly:8000"
  apiUrl: "http://aptly:3143/api"
  user: "molior"
  password: "molior-dev"
  gpgKey: "reposign@molior"
  downloadConcurrency: 4
  downloadRetries: 0
  downloader: "default"
  logLevel: "info"
  # Aptly Publishing endpoints
  # See charts/templates/configmap-aptly.yaml for all supported fields
  filesystemPublishEndpoints: {}
  jfrogPublishEndpoints: {}
  s3PublishEndpoints: {}
  # S3 Example
  #   myrepo:
  #     region: us-east-1
  #     bucket: my-bucket
  #     acl: private
  #     access_key_id: ""
  #     secret_access_key: ""
  gcsPublishEndpoints: {}
  swiftPublishEndpoints: {}
  azurePublishEndpoints: {}

builder:
  amd64:
    parallel: 10
