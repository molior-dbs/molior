# The passwords (molior-password, aptly-password, registry-password) are not values: they are read from the
# Secret molior-passwords, which must exist in the namespace before the install (see INSTALL.md).
registry:
  host: k3d-molior-registry
  port:
  user: ""

molior:
  version: dev
  # Group id of the data volume (pod securityContext.fsGroup), unset by default
  fsGroup: ""
  # Set to true on dev clusters: allows plain-HTTP session cookies and
  # treats a missing admin_password as a warning rather than a hard error.
  dev: false
  # Base path when molior is served
  # Must end with a slash. Leave as "/" for root deployments.
  basePath: "/"
  serverUrl: "http://molior:9999"
  hostname: "127.0.0.1"
  debsignEmail: "debsign@molior"
  versionPrefix: "v"
  ciBuildsEnabled: true
  ciPackagesTtl: 7
  backend: "kubernetes"
  maxParallelChroots: 4
  # source builds running at the same time inside the molior pod (git, dpkg-buildpackage -S, download); 0: no limit
  maxParallelSourceBuilds: 4
  terminationGracePeriodSeconds: 300

aptly:
  # Group id of the data volume (pod securityContext.fsGroup), unset by default
  fsGroup: ""
  publicUrl: "http://localhost:8080"
  internalUrl: "http://aptly:8000"
  apiUrl: "http://aptly:3143/api"
  user: "molior"
  gpgKey: "reposign@molior"
  downloadConcurrency: 4
  downloadRetries: 0
  downloader: "default"
  logLevel: "info"
  # Aptly Publishing endpoints
  # See charts/templates/configmap-aptly.yaml for all supported fields
  filesystemPublishEndpoints: {}
  jfrogPublishEndpoints: {}
  s3PublishEndpoints: {}
  # S3 Example
  #   myrepo:
  #     region: us-east-1
  #     bucket: my-bucket
  #     acl: private
  #     access_key_id: ""
  #     secret_access_key: ""
  gcsPublishEndpoints: {}
  swiftPublishEndpoints: {}
  azurePublishEndpoints: {}

# Size requested by the PVCs. 100Mi is enough for a test cluster, set real sizes per instance.
storage:
  molior: 100Mi
  aptly: 100Mi
  postgres: 100Mi

# nodeLabel: the one node label (key=value) a build pod needs, so it only runs on matching nodes.
# The standard architecture label is the default. Nodes without it must be labeled, for example:
#   kubectl label node <node> molior/builder=arm64
builder:
  amd64:
    parallel: 10
    nodeLabel: kubernetes.io/arch=amd64
  # armhf builds use the arm64 queue
  arm64:
    parallel: 1
    nodeLabel: kubernetes.io/arch=arm64
